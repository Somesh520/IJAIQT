version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: college_journal_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongo_data:/data/db
    networks:
      - journal_network

  mongo-express:
    image: mongo-express:latest
    container_name: college_journal_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: adminpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:adminpassword@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - journal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_journal_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGODB_URI: mongodb://admin:adminpassword@mongodb:27017/college_journal?authSource=admin
      JWT_SECRET: your-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: your-jwt-refresh-secret-change-in-production
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - journal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_journal_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - journal_network

volumes:
  mongo_data:

networks:
  journal_network:
    driver: bridge
